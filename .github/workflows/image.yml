name: Desktop image

# Push a tag such as image-v3 (matching image.Version in internal/image/image.go) to build the
# desktop image for both architectures and attach it to a GitHub Release.
on:
  push:
    tags: ["image-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and export
        run: |
          version="${GITHUB_REF_NAME#image-v}"
          name="adf-desktop-v${version}-linux-${{ matrix.arch }}.tar"
          docker buildx build --platform "linux/${{ matrix.arch }}" \
            --build-arg "ADF_IMAGE_VERSION=${version}" \
            --output "type=docker,dest=${name}" internal/image
          gzip -9 "${name}"
          sha256sum "${name}.gz" > "${name}.gz.sha256"
          ls -la "${name}.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: adf-desktop-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" adf-desktop-* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Desktop image ${GITHUB_REF_NAME#image-}" --latest=false \
            --notes "Prebuilt adf desktop image (Debian trixie, Xvfb, openbox, Firefox ESR, fonts) for linux/amd64 and linux/arm64. adf downloads it automatically."
