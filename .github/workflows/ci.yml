name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet (linux, darwin, windows)
        run: |
          go vet ./...
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...
      - name: Unit tests
        run: go test -race ./...
      - name: Console script syntax
        run: node --check internal/console/web/app.js
      - name: Build every release target
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/adf
          done
